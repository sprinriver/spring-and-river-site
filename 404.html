<!--
  This page is served for ANY unmatched path, including nested ones such as
  /a/b/c. Relative asset paths would resolve against that path and 404 in turn,
  so the styles below are inlined and every link is root-relative. That keeps
  the page self-contained and correct at any depth.
-->
<style>
  :root {
    --navy-900: #06121F; --navy-700: #0F2947; --blue-500: #2465B4;
    --amber: #FFCE1B; --steel-200: #E0E7EF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 100%);
    color: #B4C7DC; line-height: 1.65; padding: 32px 24px; position: relative; overflow-x: hidden;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 60% 40%, #000 30%, transparent 78%);
    mask-image: radial-gradient(ellipse 80% 70% at 60% 40%, #000 30%, transparent 78%);
  }
  main { position: relative; z-index: 2; max-width: 560px; width: 100%; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .78rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: var(--amber); display: inline-flex; align-items: center; gap: .7em; margin-bottom: 1.1rem;
  }
  .code::before { content: ""; width: 24px; height: 3px; background: var(--amber); }
  h1 {
    color: #fff; font-size: clamp(1.9rem, 5vw, 2.9rem); line-height: 1.15;
    letter-spacing: -.02em; margin: 0 0 .5em;
  }
  p { margin: 0 0 2rem; font-size: 1.03rem; max-width: 46ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 13px; margin-bottom: 2.6rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .55em; padding: 13px 25px;
    font-size: .95rem; font-weight: 600; text-decoration: none;
    border: 1px solid transparent; transition: transform .18s, background .18s, border-color .18s, color .18s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--amber); color: var(--navy-900); }
  .btn-primary:hover { background: #FFD84A; }
  .btn-ghost { border-color: rgba(255,255,255,.28); color: #fff; }
  .btn-ghost:hover { border-color: var(--amber); color: var(--amber); }
  nav { border-top: 1px solid rgba(255,255,255,.14); padding-top: 1.5rem; }
  nav h2 {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
    color: #7F97B4; font-weight: 600; margin: 0 0 .9rem;
  }
  nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; }
  nav a { color: #B4C7DC; text-decoration: none; font-size: .95rem; }
  nav a:hover { color: var(--amber); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main>
    <span class="code">Error 404</span>

        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
